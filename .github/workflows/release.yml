name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the tag matches the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/adam_audio/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Generate release notes
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/generate_release_notes.py > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          body_path: release_notes.md
