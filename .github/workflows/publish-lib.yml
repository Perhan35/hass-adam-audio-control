name: Publish Library to PyPI

on:
  push:
    tags:
      - "lib-v*"

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check the tag matches the library version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('lib/pyproject.toml', 'rb'))['project']['version'])")
          if [ "lib-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match library version $version"
            exit 1
          fi

      - name: Install build tool
        run: pip install build

      - name: Build library
        run: python -m build lib/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: lib/dist/
